name: Bug
description: Report a defect in the foundation, the docs, or the workflows.
labels: ["bug"]
assignees:
  - Rekkie19
body:
  - type: markdown
    attributes:
      value: |
        Describe the defect. Redact AWS account IDs, access keys, passwords, session tokens, ARNs that identify your account, and Terraform state before you paste logs. A security vulnerability belongs in private reporting, not in this form. See SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, in one or two sentences?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Repository hygiene
        - Terraform
        - CI
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands and paths are useful. Leave out account identifiers and secrets.
      placeholder: |
        1. Open docs/root-account-lockdown.md
        2. Follow the billing-alarm link
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Terraform version, module path, or workflow name. No account IDs.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Paste only output you have already redacted. It will render as a code block.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: I removed secrets, credentials, and AWS account IDs from this report.
          required: true
        - label: This is not a security vulnerability. Vulnerability reports use private reporting.
          required: true
