# Version updates for GitHub Actions and Terraform.
# directory does not recurse. Add a terraform entry for each new root module
# or module directory when it gains .tf files. GitHub Actions stays empty
# until workflows exist.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /bootstrap/state-backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      terraform:
        patterns:
          - "*"
